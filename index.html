<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick 二手車｜嚴選中古車</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f5f5f2;color:#1d1d1b;line-height:1.6}
header{background:#111;color:#fff;padding:48px 20px;text-align:center}
header h1{font-size:32px;letter-spacing:2px}
header p{color:#bbb;margin-top:8px}
.btns{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600}
.line{background:#06c755;color:#fff}
.fb{background:#1877f2;color:#fff}
.ig{background:#fff;color:#111}
main{max-width:1000px;margin:0 auto;padding:32px 16px}
h2{font-size:22px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e5e0}
.photo{height:180px;background:#ddd;display:flex;align-items:center;justify-content:center;color:#888}
.info{padding:14px 16px}
.info h3{font-size:18px}
.spec{color:#666;font-size:14px;margin:4px 0 8px}
.price{color:#d0342c;font-size:22px;font-weight:700}
.why{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.why div{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e5e0}
footer{text-align:center;color:#888;padding:32px 16px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Nick 二手車</h1>
  <p>誠實車況・透明價格・買車找 Nick 就對了</p>
  <div class="btns">
    <a class="btn line" href="#">LINE 詢問</a>
    <a class="btn fb" href="#">Facebook</a>
    <a class="btn ig" href="#">Instagram</a>
  </div>
</header>
<main>
  <h2>在售車輛</h2>
  <div class="grid">
    <div class="card"><div class="photo">車輛照片</div><div class="info"><h3>範例車款 A</h3><p class="spec">年份・里程・排氣量</p><p class="price">洽詢</p></div></div>
    <div class="card"><div class="photo">車輛照片</div><div class="info"><h3>範例車款 B</h3><p class="spec">年份・里程・排氣量</p><p class="price">洽詢</p></div></div>
    <div class="card"><div class="photo">車輛照片</div><div class="info"><h3>範例車款 C</h3><p class="spec">年份・里程・排氣量</p><p class="price">洽詢</p></div></div>
  </div>
  <div class="why">
    <div><h3>車況透明</h3><p>每台車詳細說明，不藏問題。</p></div>
    <div><h3>協助貸款</h3><p>分期方案幫你規劃。</p></div>
    <div><h3>找車服務</h3><p>想要的車款告訴我，幫你找。</p></div>
  </div>
</main>
<footer>© Nick 二手車</footer>
</body>
</html>
